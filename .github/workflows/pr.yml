name: PR verification

on:
  pull_request:
    branches: [development]
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-checks:
    name: Host checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go for actionlint
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.0'
          cache: false

      - name: Lint GitHub Actions workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color

      - name: Run repository verification
        env:
          VERIFY_BASE: ${{ github.event.pull_request.base.sha }}
          VERIFY_HEAD: ${{ github.event.pull_request.head.sha }}
        run: make verify

  firmware-build:
    name: Firmware build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      DOCKER_BUILDKIT: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch pinned Simplicity SDK
        env:
          CI_SISDK_ROOT: ${{ runner.temp }}/simplicity_sdk-v2025.6.3
        run: make prepare-ci-sdk

      - name: Build pinned firmware toolchain image
        run: make docker-image

      - name: Build EFR32MG21 firmware
        env:
          SISDK_ROOT: ${{ runner.temp }}/simplicity_sdk-v2025.6.3
        run: make docker-firmware

  workflow-security:
    name: Workflow security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit workflows with zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: v1.30.1
          advanced-security: false
          annotations: true
          min-severity: medium
          min-confidence: medium

  secret-scan:
    name: Secret scan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan changed commits with TruffleHog
        uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          version: '3.97.9'
          extra_args: --results=verified,unknown,unverified
